<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 380px;
      background: #0f0f1a;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 24px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header .shield {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
    }

    .header h1 {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .header .subtitle {
      font-size: 13px;
      color: #a5b4fc;
      font-weight: 400;
    }

    #checkBtn {
      width: 100%;
      padding: 12px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 16px;
      transition: background 0.2s;
    }

    #checkBtn:hover {
      background: #4338ca;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 16px 0;
      color: #9ca3af;
      font-style: italic;
      font-size: 14px;
    }

    #result {
      display: none;
      margin-top: 8px;
    }

    .score-bar {
      width: 100%;
      height: 12px;
      background: #1e1e3a;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    #scoreFill {
      height: 100%;
      width: 0%;
      border-radius: 6px;
      transition: width 0.8s ease-in-out;
    }

    #label {
      font-size: 22px;
      font-weight: bold;
      text-align: center;
      margin-bottom: 4px;
    }

    #probability {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 14px;
    }

    #flagsContainer {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }

    .flag-badge {
      background: #1e1e3a;
      border: 1px solid #4f46e5;
      color: #a5b4fc;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      margin: 3px;
    }

    #error {
      display: none;
      color: #ef4444;
      text-align: center;
      font-size: 13px;
      padding: 12px 0;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid #1e1e3a;
      font-size: 11px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="shield">🛡️</span>
    <h1>Fake Job Detector</h1>
    <p class="subtitle">AI-Powered Job Safety Check</p>
  </div>

  <button id="checkBtn">Check This Job</button>

  <div id="loading">Analyzing job posting...</div>

  <div id="result">
    <div class="score-bar">
      <div id="scoreFill"></div>
    </div>
    <div id="label"></div>
    <div id="probability"></div>
    <div id="flagsContainer"></div>
  </div>

  <div id="error"></div>

  <div class="footer">Fake Job Detector v1.0 | Final Year Project</div>

  <script src="popup.js"></script>
</body>
</html>
